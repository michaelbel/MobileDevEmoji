name: Publish Application on GitHub Pages

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-web:
    name: Build Kotlin/Wasm
    runs-on: ubuntu-latest
    outputs:
      DIST_BYTES: ${{ steps.size.outputs.bytes }}
      DIST_HUMAN: ${{ steps.size.outputs.human }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: setup gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: build with token
        if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: ./gradlew :webApp:jsBrowserDistribution

      - name: build without token (fork PR)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true }}
        run: ./gradlew :webApp:jsBrowserDistribution -PALLOW_EMPTY_GH_TOKEN=true

      - name: fix permissions
        run: chmod -R 0755 webApp/build/dist/js/productionExecutable/

      - name: compute dist size
        id: size
        run: |
          BYTES=$(du -sb webApp/build/dist/js/productionExecutable/ | cut -f1)
          echo "bytes=$BYTES" >> "$GITHUB_OUTPUT"
          echo "human=$(numfmt --to=iec-i --suffix=B "$BYTES")" >> "$GITHUB_OUTPUT"

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webApp/build/dist/js/productionExecutable/

  deploy:
    name: Deploy to GitHub Pages
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: notify telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          MESSAGE: |
            ✅ *GitHub Pages deployed*
            *Repo:* [${{ github.repository }}](${{ github.server_url }}/${{ github.repository }})
            *Branch:* [${{ github.ref_name }}](${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }})
            *Commit:* [${{ needs.job-common.outputs.SHORT_SHA }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            *Pages:* ${{ steps.deployment.outputs.page_url }}
            *MiniApp:* http://t.me/MobileDevEmojiBot/mdeapp
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "message_thread_id=${THREAD_ID}" \
            -d "parse_mode=Markdown" \
            --data-urlencode "text=${MESSAGE}"