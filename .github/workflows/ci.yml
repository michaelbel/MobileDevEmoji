name: Publish Application on GitHub Pages

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-web:
    name: Build Kotlin/Wasm
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: setup gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: build with token
        if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: ./gradlew :webApp:jsBrowserDistribution

      - name: build without token (fork PR)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true }}
        run: ./gradlew :webApp:jsBrowserDistribution -PALLOW_EMPTY_GH_TOKEN=true

      - name: fix permissions
        run: chmod -R 0755 webApp/build/dist/js/productionExecutable/

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webApp/build/dist/js/productionExecutable/

  deploy:
    name: Deploy to GitHub Pages
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v4