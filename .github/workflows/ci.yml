name: Publish Application on GitHub Pages

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-web:
    name: Build Kotlin/Wasm
    runs-on: ubuntu-latest
    outputs:
      DIST_BYTES: ${{ steps.size.outputs.bytes }}
      DIST_HUMAN: ${{ steps.size.outputs.human }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: setup gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: build with token
        if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: ./gradlew :webApp:jsBrowserDistribution

      - name: build without token (fork PR)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true }}
        run: ./gradlew :webApp:jsBrowserDistribution -PALLOW_EMPTY_GH_TOKEN=true

      - name: fix permissions
        run: chmod -R 0755 webApp/build/dist/js/productionExecutable/

      - name: compute dist size
        id: size
        run: |
          BYTES=$(du -sb webApp/build/dist/js/productionExecutable/ | cut -f1)
          echo "bytes=$BYTES" >> "$GITHUB_OUTPUT"
          echo "human=$(numfmt --to=iec-i --suffix=B "$BYTES")" >> "$GITHUB_OUTPUT"

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webApp/build/dist/js/productionExecutable/

  deploy:
    name: Deploy to GitHub Pages
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: notify telegram
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }} # опционально
          STATUS: ${{ job.status }}
          RUN_NUMBER: ${{ github.run_number }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          DIST_HUMAN: ${{ needs.build-web.outputs.DIST_HUMAN }}
          TITLE_OR_MSG: ${{ github.event.pull_request.title || github.event.head_commit.message || '' }}
        run: |
          ICON="❌"
          [ "$STATUS" = "success" ] && ICON="✅"

          SHORT_SHA="${GITHUB_SHA:0:7}"

          MESSAGE="$ICON <b>Pages deploy: $STATUS</b>
          <b>Repo:</b> $REPO
          <b>Branch:</b> <code>$BRANCH</code>
          <b>Commit:</b> <code>$SHORT_SHA</code>
          <b>Run №</b> $RUN_NUMBER
          <b>Title/Msg:</b> $TITLE_OR_MSG
          <b>Dist size:</b> $DIST_HUMAN
          <b>Run:</b> $RUN_URL
          <b>Pages:</b> $PAGE_URL
  
          <b>Site:</b> http://michaelbel.github.io/MobileDevEmoji
          <b>Mini App:</b> http://t.me/MobileDevEmojiBot/mdeapp"
  
          # если есть thread_id — добавим, иначе пропустим
          THREAD_ARG=()
          [ -n "$THREAD_ID" ] && THREAD_ARG=(-d "message_thread_id=$THREAD_ID")
  
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
          -d "chat_id=${CHAT_ID}" \
          -d "parse_mode=HTML" \
          --data-urlencode "text=${MESSAGE}" \
          "${THREAD_ARG[@]}"